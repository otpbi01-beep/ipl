<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy IPL Offer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; }
        #loader { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 18px; color: #666; }
    </style>
</head>
<body>
    <div id="loader">🎁 Loading Swiggy IPL Special Offer...</div>
    <div id="content"></div>

    <script>
        const targetUrl = "https://www.swiggy.com/ipl-landing?x-channel=jiohotstar&hsClkId=f69664a025104e65b977cff483867cdf.f69664a025104e65b977cff483867cdf.SwiggyLimited_Swiggy_IPL26_BrandTab_campaignName_BrandTab.1775568784797";
        
        // Open-source proxy use karke pure block ko bypass kar rahe hain
        fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl))
            .then(response => response.text())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                
                // Pure HTML content ko page ke andar directly inject kar rahe hain
                let cleanData = data.replace(/<head>/i, '<head><base href="https://www.swiggy.com/">');
                document.getElementById('content').innerHTML = cleanData;
            })
            .catch(err => {
                document.getElementById('loader').innerText = "Redirecting to Swiggy...";
                window.location.href = targetUrl;
            });
    </script>
</body>
</html>
